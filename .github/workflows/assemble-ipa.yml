name: Assemble Hardened IPA
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardened-ipa

      - name: Concatenate chunks
        run: |
          cd ipa_chunks
          cat FreeFire_Hardened.ipa.part*.bin > ../FreeFire_Hardened.ipa
          cd ..
          sha256sum FreeFire_Hardened.ipa
          ls -lh FreeFire_Hardened.ipa

      - name: Verify SHA
        run: |
          EXPECTED=58f14d8eaf4b7c7dd21f46af3171d62a90704de7d28d9fdcfef21504fa7f7590
          ACTUAL=$(sha256sum FreeFire_Hardened.ipa | awk '{print $1}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "SHA mismatch!"; exit 1; }

      - name: Upload as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hardened-v1
          name: Free Fire Hardened
          body: |
            v2 - minimal byte-level LC_ID_DYLIB rewrite, LC_CODE_SIGNATURE preserved.
            SHA256: 58f14d8eaf4b7c7dd21f46af3171d62a90704de7d28d9fdcfef21504fa7f7590
          files: FreeFire_Hardened.ipa
          draft: false
          prerelease: false
